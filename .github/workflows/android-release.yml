name: Build downloadable Gut Farms APK

on:
  push:
    branches: [master, "cursor/**"]
    tags: ["v*"]
  pull_request:
    paths:
      - "FarmManager/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FarmManager

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage downloadable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/GutFarms-FarmManager.apk
          cp app/build/outputs/apk/release/app-release.apk "dist/GutFarms-FarmManager-${{ github.ref_name }}.apk" || true
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GutFarms-FarmManager-apk
          path: FarmManager/dist/GutFarms-FarmManager.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: FarmManager/dist/GutFarms-FarmManager.apk
          generate_release_notes: true
          body: |
            ## Gut Farms — Android install

            1. Download **GutFarms-FarmManager.apk** below
            2. On your phone: allow install from this source / unknown apps
            3. Open the APK and install

            Requires Android 8.0+ (API 26).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
