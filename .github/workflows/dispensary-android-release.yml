name: Build downloadable Native Pure Dispensary APK

on:
  push:
    branches: [master, "cursor/**"]
    tags: ["dispensary-v*", "nativepure-v*"]
  pull_request:
    paths:
      - "Dispensary/**"
      - ".github/workflows/dispensary-android-release.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dispensary

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage downloadable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/NativePure-Dispensary.apk
          cp app/build/outputs/apk/release/app-release.apk dist/Solstice-Dispensary.apk
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NativePure-Dispensary-apk
          path: |
            Dispensary/dist/NativePure-Dispensary.apk
            Dispensary/dist/Solstice-Dispensary.apk
          if-no-files-found: error
