agent:
  name: pi-income-agent
  mode: paper
  allow_simulator_fallback: true

universe:
  - SCHD
  - VYM
  - JEPI
  - QQQ
  - SPY
  - BND
  - GLD
  - AAPL
  - MSFT
  - NVDA

risk:
  max_position_pct: 0.15
  max_daily_loss_pct: 0.03
  cash_reserve_pct: 0.10
  max_open_positions: 8
  min_confidence: 0.55
  min_trade_notional: 25.0

broker:
  backend: paper
  starting_cash: 10000.0

market:
  lookback_days: 60
  provider: yahoo

llm:
  provider: none
  temperature: 0.2
  timeout_seconds: 45

schedule:
  interval_minutes: 60
  market_tz: America/New_York
  prefer_market_hours: true

dashboard:
  # Localhost by default — SSH tunnel or Tailscale; set 0.0.0.0 only if intentional
  host: 127.0.0.1
  port: 8787
  require_auth: true

alerts:
  enabled: true
  drawdown_alert_pct: 0.05

wallet:
  backend: paper
  assets: [USD, USDC, BTC, ETH]
  starting_balances:
    USD: 1000.0
    USDC: 0.0
    BTC: 0.0
    ETH: 0.0
  networks:
    USD: ach-sim
    USDC: ethereum
    BTC: bitcoin
    ETH: ethereum
  min_send:
    USD: 1.0
    USDC: 1.0
    BTC: 0.0001
    ETH: 0.001
  send_fee:
    USD: 0.0
    USDC: 0.0
    BTC: 0.00001
    ETH: 0.0002
  max_daily_send_usd: 250.0
  allowlist_required: true
  allowlist_bootstrap: []
  require_send_confirmation: true

safety:
  journal_enabled: true
  audit_enabled: true
