[package]
name = "boriken-desktop"
version = "0.2.0"
edition = "2021"
description = "High-graphics Borikén language learning desktop app"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "0.29.1", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.29.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
chrono = "0.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
