ture": "wa- + VERB", "level": 1}, {"id": "possessed_object_svo", "name": "SVO with possessed object", "pattern": "{SUBJ_PREFIX}-{VERB} {POSS_PREFIX}-{NOUN}", "slots": ["SUBJECT", "VERB", "POSSESSOR", "OBJECT"], "example": "da-arika li-kanowa", "gloss": "I see his canoe", "spanish": "Veo su canoa", "structure": "SUBJECT-VERB + POSSESSED OBJECT", "level": 2}, {"id": "descriptor", "name": "Noun + quality", "pattern": "{NOUN} {ADJ}", "slots": ["NOUN", "QUALITY"], "example": "to-isa chali", "gloss": "her child is happy", "spanish": "su hijo/a está feliz", "structure": "NOUN + ADJECTIVE", "level": 2}, {"id": "location_motion", "name": "Go to place", "pattern": "waibá / {SUBJ_PREFIX}-iba {PLACE}", "slots": ["SUBJECT", "VERB", "PLACE"], "example": "waibá batey", "gloss": "let's go to the batey", "spanish": "vamos al batey", "structure": "MOTION + PLACE", "level": 2}, {"id": "give_dative", "name": "Give to someone", "pattern": "busika {RECIPIENT}", "slots": ["VERB", "RECIPIENT"], "example": "busika wakía", "gloss": "give to us", "spanish": "danos / da a nosotros", "structure": "GIVE + RECIPIENT", "level": 2}, {"id": "negated_clause", "name": "Do not …", "pattern": "mayani {OBJECT?} / ma-{STEM}", "slots": ["NEGATION", "STEM"], "example": "mayani makana", "gloss": "do not kill (with the club)", "spanish": "no mates", "structure": "NEGATION + STEM/CLAUSE", "level": 3, "notes": "mayani is attested in colonial records."}, {"id": "complex_attested", "name": "Attested multi-part", "pattern": "{IMPERATIVE}, {VOCATIVE}, {CLAUSE}", "slots": ["VERB", "VOCATIVE", "CLAUSE"], "example": "O kãma, waxeri, warikẽ kawóna yari", "gloss": "O hear, sir, we see gold jewels", "spanish": "Oh oye, señor, vemos joyas de oro", "structure": "CALL + COMMAND + SVO CLAUSE", "level": 3, "notes": "One of the six attested spoken sentences."}];
const LEARNER = [{"boriken": "Taí wey.", "english": "Good day.", "spanish": "Buenos días.", "attested": false, "pattern_id": "imperative", "structure": "GREETING PHRASE"}, {"boriken": "Taíno daka.", "english": "I am Taíno.", "spanish": "Soy taíno.", "attested": false, "pattern_id": "identity", "structure": "PREDICATE + daka"}, {"boriken": "Naboriya daka.", "english": "I am a worker.", "spanish": "Soy trabajador.", "attested": false, "pattern_id": "identity", "structure": "PREDICATE + daka"}, {"boriken": "Wa-borikén taí.", "english": "Our Borikén is good.", "spanish": "Nuestro Borikén es bueno.", "attested": false, "pattern_id": "descriptor", "structure": "POSSESSED NOUN + ADJECTIVE"}, {"boriken": "Da-bohío.", "english": "My house.", "spanish": "Mi casa.", "attested": false, "pattern_id": "possessed_noun", "structure": "POSSESSOR-NOUN"}, {"boriken": "Da-bohío ka-ni.", "english": "My house has water.", "spanish": "Mi casa tiene agua.", "attested": false, "pattern_id": "attributive", "structure": "POSSESSED NOUN + ka-STEM"}, {"boriken": "Waibá batey.", "english": "Let's go to the batey.", "spanish": "Vamos al batey.", "attested": false, "pattern_id": "location_motion", "structure": "MOTION + PLACE"}, {"boriken": "Li-kanowa wa.", "english": "His canoe is large.", "spanish": "Su canoa es grande.", "attested": false, "pattern_id": "descriptor", "structure": "POSSESSED NOUN + ADJECTIVE"}, {"boriken": "To-isa chali.", "english": "Her child is happy.", "spanish": "Su hijo/a está feliz.", "attested": false, "pattern_id": "descriptor", "structure": "POSSESSED NOUN + ADJECTIVE"}, {"boriken": "Da-aka kasabi.", "english": "I eat cassava bread.", "spanish": "Como casabe.", "attested": false, "pattern_id": "svo_present", "structure": "SUBJECT-VERB + OBJECT"}, {"boriken": "Wa-sá ni.", "english": "We drink water.", "spanish": "Bebemos agua.", "attested": false, "pattern_id": "svo_present", "structure": "SUBJECT-VERB + OBJECT"}, {"boriken": "Li-arika wey.", "english": "He sees the sun.", "spanish": "Él ve el sol.", "attested": false, "pattern_id": "svo_present", "structure": "SUBJECT-VERB + OBJECT"}, {"boriken": "To-aka wayaba.", "english": "She eats guava.", "spanish": "Ella come guayaba.", "attested": false, "pattern_id": "svo_present", "structure": "SUBJECT-VERB + OBJECT"}, {"boriken": "Da-arika li-kanowa.", "english": "I see his canoe.", "spanish": "Veo su canoa.", "attested": false, "pattern_id": "possessed_object_svo", "structure": "SUBJECT-VERB + POSSESSED OBJECT"}, {"boriken": "Ma-hurakán.", "english": "No hurricane / without storm.", "spanish": "Sin huracán.", "attested": false, "pattern_id": "negative_noun", "structure": "ma- + STEM"}, {"boriken": "Ma-ni.", "english": "Without water.", "spanish": "Sin agua.", "attested": false, "pattern_id": "negative_noun", "structure": "ma- + STEM"}, {"boriken": "Ka-semí yukayeke.", "english": "The village has spirits.", "spanish": "La aldea tiene cemíes.", "attested": false, "pattern_id": "attributive", "structure": "ka-STEM + NOUN"}, {"boriken": "Ka-kawóna.", "english": "Having gold.", "spanish": "Con oro.", "attested": false, "pattern_id": "attributive", "structure": "ka- + STEM"}, {"boriken": "Ahiya wakía baba.", "english": "Speak, our father.", "spanish": "Habla, nuestro padre.", "attested": false, "pattern_id": "imperative", "structure": "VERB + VOCATIVE"}, {"boriken": "Kãma, waxeri.", "english": "Hear, sir.", "spanish": "Oye, señor.", "attested": false, "pattern_id": "imperative", "structure": "VERB + VOCATIVE"}, {"boriken": "Da-arika wey.", "english": "I see the sun.", "spanish": "Veo el sol.", "attested": false, "pattern_id": "svo_present", "structure": "SUBJECT-VERB + OBJECT"}, {"boriken": "Kokí ahiya.", "english": "The coquí speaks / sings.", "spanish": "El coquí habla / canta.", "attested": false, "pattern_id": "svo_no_object", "structure": "NOUN + VERB"}, {"boriken": "Anichi borikén.", "english": "Love Borikén.", "spanish": "Ama a Borikén.", "attested": false, "pattern_id": "imperative", "structure": "VERB + OBJECT"}, {"boriken": "Busika wakía.", "english": "Give to us.", "spanish": "Danos.", "attested": false, "pattern_id": "give_dative", "structure": "GIVE + RECIPIENT"}, {"boriken": "Waibá.", "english": "Let's go.", "spanish": "Vámonos.", "attested": true, "pattern_id": "hortative", "structure": "wa- + VERB"}, {"boriken": "Da-sá ni.", "english": "I drink water.", "spanish": "Yo bebo agua.", "attested": false, "pattern_id": "svo_present", "structure": "SUBJECT-VERB + OBJECT"}, {"boriken": "Wa-aka kasabi.", "english": "We eat cassava bread.", "spanish": "Comemos casabe.", "attested": false, "pattern_id": "svo_present", "structure": "SUBJECT-VERB + OBJECT"}, {"boriken": "To-bohío chali.", "english": "Her house is joyful/happy.", "spanish": "Su casa es alegre.", "attested": false, "pattern_id": "descriptor", "structure": "POSSESSED NOUN + ADJECTIVE"}, {"boriken": "Li-baba ahiya.", "english": "His father speaks.", "spanish": "Su padre habla.", "attested": false, "pattern_id": "svo_no_object", "structure": "POSSESSED NOUN + VERB"}, {"boriken": "Wa-kanowa iba bara.", "english": "Our canoe goes to the sea.", "spanish": "Nuestra canoa va al mar.", "attested": false, "pattern_id": "location_motion", "structure": "POSSESSED NOUN + VERB + PLACE"}];
const OVERVIEW = {"english": "Neo-Taíno Boriken for learners usually follows Subject–Verb–Object (SVO). Person is often marked on the verb with the same prefixes used for possession (da-/wa-/li-/to-). Identity sentences use daka ('I am').", "spanish": "El boriken neo-taíno para aprendices suele seguir Sujeto–Verbo–Objeto (SVO). La persona se marca en el verbo con los mismos prefijos de posesión (da-/wa-/li-/to-). Las oraciones de identidad usan daka ('yo soy')."};
const state = {
  xp: Number(localStorage.getItem("boriken_xp") || 0),
  streak: Number(localStorage.getItem("boriken_streak") || 1),
  match: null,
  flashIdx: 0,
  flashCards: [],
  storyIdx: 0,
  scramble: null,
};

function save() {
  localStorage.setItem("boriken_xp", state.xp);
  localStorage.setItem("boriken_streak", state.streak);
  document.getElementById("xp").textContent = state.xp;
  document.getElementById("streak").textContent = state.streak;
  const level = 1 + Math.floor(state.xp / 50);
  const titles = {1:"Konuko Seedling",2:"Bohío Builder",3:"Batey Player",4:"Areyto Voice",5:"Kasike Apprentice"};
  document.getElementById("level").textContent = titles[Math.min(level,5)] || "Island Elder";
}
save();

function stage(html) {
  document.getElementById("searchPanel").classList.add("hidden");
  document.getElementById("stage").innerHTML = html;
}

function addXp(n) { state.xp += n; save(); }

function pick(n=1, filter=null) {
  let pool = LEXICON.slice();
  if (filter) pool = pool.filter(filter);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, n);
}

function wordCard(w) {
  return `<div class="boriken">${w.boriken}</div>
    <div>${w.english} · <span class="muted">${w.spanish}</span></div>
    <p>${w.definition_en || ""}</p>
    <p class="gold">✦ ${w.fun_fact || ""}</p>
    <p class="muted">Example: ${w.example || w.boriken} ${w.attested ? "· attested" : "· reconstructed"}</p>`;
}

function wordOfDay() {
  const day = new Date().toISOString().slice(0,10);
  let h = 0; for (const c of day) h = (h * 33 + c.charCodeAt(0)) >>> 0;
  const w = LEXICON[h % LEXICON.length];
  addXp(15);
  stage(`<h3>Island Word of the Day</h3>${wordCard(w)}
    <p class="ok">+15 XP — use <strong>${w.boriken}</strong> once today.</p>`);
}

function startMatch() {
  const words = pick(4, w => w.pos === "noun" || w.pos === "verb");
  const answer = words[0];
  const choices = words.map(w => w.english.split(";")[0].trim());
  for (let i = choices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [choices[i], choices[j]] = [choices[j], choices[i]];
  }
  state.match = { answer: answer.english.split(";")[0].trim(), word: answer.boriken };
  stage(`<h3>Batey Match</h3>
    <div class="boriken">${answer.boriken}</div>
    <p class="muted">What does it mean?</p>
    ${choices.map(c => `<button class="choice" onclick="gradeMatch('${c.replace(/'/g, "\\'")}')">${c}</button>`).join("")}
    <p class="gold">✦ ${answer.fun_fact || ""}</p>`);
}

function gradeMatch(choice) {
  const ok = choice === state.match.answer;
  addXp(ok ? 8 : 1);
  stage(`<h3>${ok ? "The batey cheers for you." : "Almost — try again soon."}</h3>
    <p class="${ok ? "ok" : "bad"}">${state.match.word} = ${state.match.answer}</p>
    <button class="primary" onclick="startMatch()">Next match</button>`);
}

function flash() {
  state.flashCards = pick(8);
  state.flashIdx = 0;
  showFlash(false);
}

function showFlash(revealed) {
  const w = state.flashCards[state.flashIdx];
  if (!w) { stage("<p>Deck complete. Waibá!</p>"); return; }
  stage(`<h3>Memory Bohío (${state.flashIdx+1}/${state.flashCards.length})</h3>
    <div class="boriken">${revealed ? w.boriken : w.english.split(";")[0]}</div>
    ${revealed ? wordCard(w) : '<p class="muted">Say the Boriken form, then flip.</p>'}
    <div class="grid" style="margin-top:10px">
      <button onclick="showFlash(true)">Flip</button>
      <button class="primary" onclick="(addXp(5), state.flashIdx++, showFlash(false))">Got it</button>
    </div>`);
}

function fillBlank() {
  const w = pick(1, x => x.example && x.example.includes(x.boriken))[0] || pick(1)[0];
  const prompt = (w.example || w.boriken).replace(w.boriken, "____");
  stage(`<h3>Konuko Fill-In</h3>
    <p class="boriken">${prompt}</p>
    <p class="muted">${w.definition_en.split(".")[0]}.</p>
    <input id="fill" placeholder="type Boriken word"/>
    <button class="primary" onclick="checkFill('${w.boriken.replace(/'/g, "\\'")}')">Plant it</button>`);
}

function checkFill(answer) {
  const val = (document.getElementById("fill").value || "").trim().toLowerCase();
  const ok = val === answer.toLowerCase();
  addXp(ok ? 8 : 1);
  stage(`<p class="${ok ? "ok" : "bad"}">${ok ? "Root takes hold." : "Answer: " + answer}</p>
    <button class="primary" onclick="fillBlank()">Another</button>`);
}

function showSearch() {
  document.getElementById("searchPanel").classList.remove("hidden");
  stage('<p class="muted">Search the lexicon below.</p>');
  search();
}

function search() {
  const q = (document.getElementById("q").value || "").toLowerCase().trim();
  const hits = !q ? pick(5) : LEXICON.filter(w =>
    (w.boriken + w.english + w.spanish + w.definition_en).toLowerCase().includes(q)
  ).slice(0, 8);
  document.getElementById("searchOut").innerHTML = hits.map(w =>
    `<div class="panel" style="margin:8px 0">${wordCard(w)}</div>`
  ).join("") || "<p>No matches.</p>";
}

const STORY = [
  { scene: "Dawn", text: "The wey climbs. A coquí calls.", prompt: "Greet the morning", answer: "Taí wey", choices: ["Taí wey", "Makabuka"] },
  { scene: "Konuko", text: "You grate yuka for bread.", prompt: "Name the bread", answer: "kasabi", choices: ["kasabi", "hamaka"] },
  { scene: "Batey", text: "Drums for an areyto. Introduce yourself.", prompt: "I am Taíno", answer: "Taíno daka", choices: ["Taíno daka", "Waibá ni"] },
  { scene: "Path", text: "Friends wait by the kanowa.", prompt: "Rally the crew", answer: "Waibá", choices: ["Waibá", "Ua"] },
];

function story() {
  state.storyIdx = 0;
  showStory();
}

function showStory() {
  const b = STORY[state.storyIdx];
  if (!b) {
    addXp(20);
    stage("<h3>Areyto complete</h3><p class='ok'>+20 XP — you walked a morning in Borikén.</p>");
    return;
  }
  stage(`<h3>Areyto Quest · ${b.scene}</h3>
    <p>${b.text}</p>
    <p class="muted">${b.prompt}</p>
    ${b.choices.map(c => `<button class="choice" onclick="storyPick('${c.replace(/'/g, "\\'")}', '${b.answer.replace(/'/g, "\\'")}')">${c}</button>`).join("")}`);
}

function storyPick(choice, answer) {
  const ok = choice === answer;
  addXp(ok ? 10 : 2);
  state.storyIdx += 1;
  stage(`<p class="${ok ? "ok" : "bad"}">${ok ? "Kasike energy unlocked." : "Remember: " + answer}</p>
    <button class="primary" onclick="showStory()">Continue</button>`);
}

function showStructure() {
  const ov = OVERVIEW.english || "Neo-Taíno Boriken usually follows Subject–Verb–Object (SVO).";
  const rows = PATTERNS.map(p =>
    `<div class="panel" style="margin:8px 0">
      <strong class="gold">${p.name || p.id}</strong>
      <div class="boriken" style="font-size:1.3rem">${p.example}</div>
      <div>${p.gloss || ""} · <span class="muted">${p.structure || ""}</span></div>
      <div class="muted">${p.pattern || ""}</div>
    </div>`
  ).join("");
  stage(`<h3>Sentence structure</h3>
    <p>${ov}</p>
    <p class="gold">da- I/my · wa- we/our · li- he/his · to- she/her · ma- without · ka- having</p>
    ${rows}
    <button class="primary" onclick="scramble()">Practice scramble</button>`);
}

function scramble() {
  const pool = LEARNER.filter(s => (s.boriken || "").replace(/-/g," ").trim().split(/\s+/).length >= 2);
  const s = pool[Math.floor(Math.random() * pool.length)];
  let tokens = s.boriken.replace(/,/g," ").split(/\s+/).filter(Boolean);
  let shuffled = tokens.slice().sort(() => Math.random() - 0.5);
  if (shuffled.join(" ") === tokens.join(" ")) shuffled = tokens.slice().reverse();
  state.scramble = { answer: s.boriken, picked: [] };
  stage(`<h3>Sentence Scramble</h3>
    <p class="muted">${s.english} · ${s.structure || ""}</p>
    <p id="built" class="boriken">____</p>
    <div id="toks">${shuffled.map(t =>
      `<button class="choice" onclick="pickTok('${t.replace(/'/g, "\\'")}')">${t}</button>`
    ).join("")}</div>
    <button onclick="scramble()">Skip</button>
    <button class="primary" onclick="checkScramble()">Check</button>`);
}

function pickTok(t) {
  if (!state.scramble) return;
  state.scramble.picked.push(t);
  document.getElementById("built").textContent = state.scramble.picked.join(" ");
}

function checkScramble() {
  if (!state.scramble) return;
  const got = state.scramble.picked.join(" ");
  const ok = got === state.scramble.answer;
  addXp(ok ? 10 : 1);
  stage(`<p class="${ok ? "ok" : "bad"}">${ok ? "Word order restored." : "Answer: " + state.scramble.answer}</p>
    <button class="primary" onclick="scramble()">Another</button>
    <button onclick="showStructure()">See structures</button>`);
}
</script>
