; ESP32-2432S028 (CYD) — companion-first C++ firmware
[env:cyd]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 4MB
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DUSER_SETUP_LOADED=1
  -DILI9341_2_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DSPI_FREQUENCY=40000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSMOOTH_FONT=1
  -DBOARD_HAS_PSRAM=0
  -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
  -std=gnu++17
  -O3
  -funroll-loops
  -ffast-math
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
board_build.partitions = min_spiffs.csv
lib_deps =
  bodmer/TFT_eSPI @ 2.5.43
extra_scripts =
  pre:scripts/pio_pre.py
  post:scripts/pio_merge.py
