[package]
name = "esp32-s3-scrypt-miner"
version = "0.1.0"
edition = "2021"
description = "Scrypt proof-of-work miner for ESP32-S3 with onboard display (LilyGO T-Display-S3)"
license = "MIT OR Apache-2.0"
readme = "README.md"

[lib]
name = "esp32_s3_scrypt_miner"
path = "src/lib.rs"

[[bin]]
name = "esp32-s3-scrypt-miner"
path = "src/bin/main.rs"
required-features = ["esp"]

[[bin]]
name = "host-miner"
path = "src/bin/host_miner.rs"
required-features = ["host"]

[[bin]]
name = "host-gui"
path = "src/bin/host_gui.rs"
required-features = ["host-gui"]

[features]
default = ["esp"]
# Cross-compile firmware for ESP32-S3 (LilyGO T-Display-S3)
esp = [
    "dep:esp-hal",
    "dep:esp-rtos",
    "dep:esp-bootloader-esp-idf",
    "dep:esp-alloc",
    "dep:esp-backtrace",
    "dep:esp-println",
    "dep:esp-radio",
    "dep:embassy-executor",
    "dep:embassy-time",
    "dep:embassy-sync",
    "dep:embassy-net",
    "dep:embassy-futures",
    "dep:critical-section",
    "dep:static_cell",
    "dep:mipidsi",
    "dep:embedded-graphics",
    "dep:embedded-hal",
    "dep:embedded-io",
    "dep:embedded-io-async",
    "dep:esp-storage",
    "dep:embedded-storage",
    "dep:trouble-host",
    "dep:log",
]
# Desktop demo / benchmarking of the same miner core
host = []
# Desktop GUI (eframe/egui) on top of the host miner core
host-gui = ["host", "dep:eframe", "dep:egui"]
# Lighter scrypt params (N=64) for tighter RAM / faster demo hashrate
lite = []

[dependencies]
heapless = "0.8"
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
eframe = { version = "=0.27.2", optional = true, default-features = true }
egui = { version = "=0.27.2", optional = true }

# ESP32-S3 firmware dependencies (enabled with `--features esp`)
esp-hal = { version = "1.1.1", features = ["esp32s3", "log-04", "unstable"], optional = true }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32s3", "log-04"], optional = true }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3", "log-04"], optional = true }
esp-alloc = { version = "0.10.0", optional = true }
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"], optional = true }
# uart output so USB Serial/JTAG can be used for post-boot credential entry
esp-println = { version = "0.17.0", default-features = false, features = ["esp32s3", "log-04", "uart"], optional = true }
esp-radio = { version = "1.0.0-beta.0", features = ["esp32s3", "wifi", "ble", "coex", "log-04", "unstable"], optional = true }
embedded-io = { version = "0.6", optional = true }
embedded-io-async = { version = "0.7", optional = true }
esp-storage = { version = "0.9", features = ["esp32s3"], optional = true }
embedded-storage = { version = "0.3", optional = true }
embassy-executor = { version = "0.10.0", features = ["log"], optional = true }
embassy-time = { version = "0.5.1", features = ["log"], optional = true }
embassy-sync = { version = "0.8.0", optional = true }
embassy-net = { version = "0.9.0", features = ["dhcpv4", "medium-ethernet", "tcp", "udp", "dns"], optional = true }
embassy-futures = { version = "0.1", optional = true }
critical-section = { version = "1.2.0", optional = true }
static_cell = { version = "2.1.1", optional = true }
mipidsi = { version = "0.10.0", optional = true }
embedded-graphics = { version = "0.8.2", optional = true }
embedded-hal = { version = "1.0.0", optional = true }
# 0.6.x tracks bt-hci 0.8 (same as esp-radio 1.0.0-beta.0). 0.7+ needs bt-hci 0.9.
trouble-host = { version = "0.6.0", features = ["default-packet-pool-mtu-255", "derive"], optional = true }
log = { version = "0.4", optional = true }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "thin"
opt-level = 3
overflow-checks = false
