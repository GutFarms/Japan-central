[package]
name = "cyd-companion"
version = "0.8.20"
edition = "2021"
description = "CYD Companion — USB SHA-256 Bitcoin mining control (PC stratum, board hashes)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "cyd-companion"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.27.2", default-features = true, features = ["persistence"] }
egui = { version = "=0.27.2" }
egui_extras = { version = "=0.27.2", features = ["image"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
serialport = { version = "4.6", default-features = true }
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
