<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="-20 -20 140 110">
  <rect x="0" y="0" width="100" height="70" fill="#1a1f16" stroke="#c5d0b0" stroke-width="0.4"/>
  <text x="4" y="6" fill="#c5d0b0" font-size="3" font-family="monospace">JCHC-1 REV A — 100×70 mm</text>
  <!-- mounting holes -->
  <circle cx="3.5" cy="3.5" r="1.6" fill="none" stroke="#888" stroke-width="0.3"/>
  <circle cx="96.5" cy="3.5" r="1.6" fill="none" stroke="#888" stroke-width="0.3"/>
  <circle cx="3.5" cy="66.5" r="1.6" fill="none" stroke="#888" stroke-width="0.3"/>
  <circle cx="96.5" cy="66.5" r="1.6" fill="none" stroke="#888" stroke-width="0.3"/>
  <!-- U1 ESP32 -->
  <rect x="19.25" y="29" width="25.5" height="18" fill="#2d4a3e" stroke="#7dffa0" stroke-width="0.3"/>
  <text x="32" y="39" fill="#7dffa0" font-size="2.2" text-anchor="middle" font-family="monospace">ESP32-S3</text>
  <!-- power -->
  <rect x="5.5" y="56" width="9" height="8" fill="#3a3020" stroke="#ffcc66" stroke-width="0.25"/>
  <text x="10" y="61" fill="#ffcc66" font-size="1.8" text-anchor="middle" font-family="monospace">USB-C</text>
  <rect x="3" y="7" width="14" height="10" fill="#3a3020" stroke="#ffcc66" stroke-width="0.25"/>
  <text x="10" y="13" fill="#ffcc66" font-size="1.6" text-anchor="middle" font-family="monospace">12V</text>
  <!-- VCORE zone -->
  <rect x="65" y="25" width="33" height="40" fill="#4a2020" fill-opacity="0.5" stroke="#ff6666" stroke-width="0.25" stroke-dasharray="1 1"/>
  <text x="81" y="30" fill="#ff9999" font-size="2" text-anchor="middle" font-family="monospace">VCORE</text>
  <rect x="66" y="43" width="12" height="10" fill="#5a3030" stroke="#ff8888" stroke-width="0.25"/>
  <text x="72" y="49" fill="#ffaaaa" font-size="1.6" text-anchor="middle" font-family="monospace">BUCK</text>
  <rect x="74" y="54" width="8" height="8" fill="#5a3030" stroke="#ff8888" stroke-width="0.25"/>
  <text x="78" y="59" fill="#ffaaaa" font-size="1.5" text-anchor="middle" font-family="monospace">L1</text>
  <!-- J1 -->
  <rect x="88.5" y="21.5" width="7" height="27" fill="#203040" stroke="#66b3ff" stroke-width="0.3"/>
  <text x="92" y="36" fill="#66b3ff" font-size="1.8" text-anchor="middle" font-family="monospace">J1</text>
  <!-- level shift -->
  <rect x="44" y="19" width="8" height="6" fill="#203020" stroke="#88ff88" stroke-width="0.25"/>
  <text x="48" y="23" fill="#88ff88" font-size="1.4" text-anchor="middle" font-family="monospace">TXS</text>
  <!-- fans/oled -->
  <rect x="22" y="6.5" width="12" height="3" fill="#303040" stroke="#aaaaff" stroke-width="0.2"/>
  <text x="28" y="8.7" fill="#aaaaff" font-size="1.3" text-anchor="middle" font-family="monospace">FAN</text>
  <rect x="39" y="6.5" width="12" height="3" fill="#303040" stroke="#aaaaff" stroke-width="0.2"/>
  <text x="45" y="8.7" fill="#aaaaff" font-size="1.3" text-anchor="middle" font-family="monospace">OLED</text>
  <!-- buttons -->
  <rect x="11" y="39" width="6" height="6" fill="#404040" stroke="#cccccc" stroke-width="0.2"/>
  <text x="14" y="43" fill="#ccc" font-size="1.2" text-anchor="middle" font-family="monospace">BT</text>
  <rect x="11" y="29" width="6" height="6" fill="#404040" stroke="#cccccc" stroke-width="0.2"/>
  <text x="14" y="33" fill="#ccc" font-size="1.2" text-anchor="middle" font-family="monospace">RS</text>
  <!-- legend -->
  <text x="0" y="78" fill="#aaa" font-size="2.2" font-family="monospace">Open kicad/jchc1.kicad_pro in KiCad 8 → assign footprints from BOM → route → Gerbers</text>
